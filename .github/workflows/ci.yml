name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ---------------------------------------------------------------------------
  # Backend validation
  # ---------------------------------------------------------------------------
  backend:
    name: Backend — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate imports
        run: python -c "from app.main import app; print('✓ app imports OK')"
        env:
          DATABASE_URL: sqlite:///./ci_test.db

      - name: Validate startup (init_db)
        run: |
          python - <<'EOF'
          import sys, os
          os.environ.setdefault("DATABASE_URL", "sqlite:///./ci_test.db")
          from app.database.init_db import init_db
          init_db()
          print("✓ init_db() completed successfully")
          EOF

      - name: Verify health endpoint is registered
        run: |
          python - <<'EOF'
          from app.main import app
          routes = [r.path for r in app.routes]
          assert "/health" in routes, f"/health missing from routes: {routes}"
          print("✓ /health endpoint registered")
          EOF
        env:
          DATABASE_URL: sqlite:///./ci_test.db

      - name: Clean up CI database
        if: always()
        run: rm -f ci_test.db

  # ---------------------------------------------------------------------------
  # Frontend validation
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

      - name: Verify build output
        run: |
          test -f dist/index.html && echo "✓ dist/index.html exists" || exit 1
